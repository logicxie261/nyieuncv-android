name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Siapkan keystore rilis (opsional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Keystore rilis dipakai."
          else
            echo "::warning::KEYSTORE_B64 tidak ada; APK ditandatangani dengan debug key (tetap bisa dipasang, tapi bukan untuk distribusi publik)."
          fi

      - name: Build APK rilis
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Checksum
        run: sha256sum app/build/outputs/apk/release/*.apk | tee app/build/outputs/apk/release/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NyieunCV-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256.txt
